name: Regenerate OG image

# Renders og-image-source.html to public/og-image.png and commits the result,
# so Cloudflare Pages (which has no build step) always serves an up-to-date PNG.
# Note: this pushes straight to main, which fails if branch protection requires
# pull requests — allow github-actions[bot] to bypass, or switch to opening a PR.

on:
  push:
    branches: [main]
    paths:
      - 'og-image-source.html'
      - 'public/fonts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Render og-image.png
    runs-on: ubuntu-latest
    # Belt and braces against a trigger loop (pushes made with GITHUB_TOKEN
    # don't start new workflow runs anyway).
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run generate-og-image

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Keep "[skip ci]" at the END of the message: GitHub Actions honors it
          # anywhere, but Cloudflare Pages only skips a deploy when the tag is a
          # prefix — and this commit must be deployed for the new image to go live.
          commit_message: "chore: regenerate og-image.png [skip ci]"
          file_pattern: public/og-image.png
